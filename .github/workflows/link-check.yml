name: link-check
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract URLs from the catalog
        run: node scripts/extract-links.mjs > urls.txt
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # --accept заменяет список по умолчанию, поэтому 2xx указаны явно.
          # 403 и 429 — магазины режут ботов, а не битые ссылки.
          args: --no-progress --max-concurrency 4 --accept 200..=299,403,429 urls.txt
